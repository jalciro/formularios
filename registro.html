<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="shortcut icon" href="img/log.png" type="image/x-icon">
</head>
<body>

<ionmain>
    <section>
        <form action="">
            <fieldset>
                <legend>Crear cuenta</legend>

                <label>Nombre completo</label>
                <input type="text" placeholder="Juana Pérez" required>
                
                <label>Género</label>
                <div class="grupo-radios">
                    <label>Femenino</label>
                    <input type="radio" value="femenino">

                <label>Masculino</label>
                <input typo="radio" value="masculino">
                <label>Otro</label>
                <input type="radio" value="otro">
            </div>

            <label>Foto de perfil</label>
            <input type="file" accept="image/*">

            <label>Correo electrónico</label>
            <input type="email" placeholder="correo@ejemplo.com" required>

            <label>Teléfono</label>
            <input type="tel" placeholder="+1 234 657 8900">

            <label>País</label>
            <select>
                <option value="">Selecciona tu pais</option>
                <option value="ar">Argentina</option>
                <option value="co">Colombia</option>
                <option value="mx">México</option>
                <option value="es">España</option>
                <option value="otro"></option>
            </select>


            <label>Contraseña</label>
            <input type="password" placeholder="*********" required>

            <label>Acepto terminos y condiciones</label>
            <input type="checkbox" required>

             <label>Deseo recibir noticias por correo</label>
            <input type="checkbox" required>

            <input type="submit" value="Regsitrarme">
            <input type="rest" value="Limpiar">

            <p class="enlace">¿Ya tienes una cuenta? <a href="login.html">Inicia sección aqui</a></p>
            </fieldset>
        </form>
    </section>
    </main>
